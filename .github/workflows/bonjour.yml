name: Bonjour CI

on: push

jobs:
    bonjour:
        runs-on: ubuntu-latest
        steps:
            - name: Dire bonjour
              run: echo "Bonjour depuis un runner GitHub !"

            - name: Présenter la machine
              run: |
                date
                uname -a
                python3 --version
                nproc
                free -h 
                df -h /
                ls -la

            - name: Récupérer le code
              uses: actions/checkout@v7

            - name: Vérifier la récupération du code  
              run: ls -la
              
            - name : Affichage du nombre de fichiers Python du dépôt
              run: ls *.py

